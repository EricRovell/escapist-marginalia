name: build

on:
  push:
    paths-ignore:
      - "**/README.md"
  pull_request:
    paths-ignore:
      - "**/README.md"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_call:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.4.1
          run_install: false
      - name: install node-js
        uses: actions/setup-node@master
        with:
          node-version: 22.x
          cache: "pnpm"
      - name: install dependencies
        run: pnpm i -r
  eslint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: check
        run: pnpm lint:code
  stylelint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: check
        run: pnpm lint:styles
  typescript:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: check
        run: pnpm lint:types
  unit-testing:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: check
        run: pnpm test:unit:ci
      - name: coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage
          if-no-files-found: error
  build-en:
    runs-on: ubuntu-latest
    needs: [ eslint, stylelint, typescript, unit-testing ]
    steps:
      - name: build
        run: pnpm build
      - name: build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./src/packages/escapist-marginalia/dist
          if-no-files-found: error
  build-ru:
    runs-on: ubuntu-latest
    needs: [ eslint, stylelint, typescript, unit-testing ]
    steps:
      - name: build
        run: LANG=ru pnpm build
      - name: build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./src/packages/escapist-marginalia/dist-ru
          if-no-files-found: error
